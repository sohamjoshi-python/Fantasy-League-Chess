name: Marketplace Turn Emails

on:
  # Manual only. Scheduled turn emails come from pg_cron → process-marketplace-turns
  # and from the live draft page. A 5-minute cron here double-sent the same pick emails.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  send-turn-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Email current snake-draft pickers
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: python scripts/send_marketplace_turn_emails.py
