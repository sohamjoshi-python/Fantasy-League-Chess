name: League Start Emails

on:
  schedule:
    # League start dates: check often enough to send the same day.
    - cron: "10 * * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send league-start emails
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: python scripts/send_league_lifecycle_emails.py
