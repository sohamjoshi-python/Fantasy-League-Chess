name: Titled Tuesday Ingestion

on:
  schedule:
    # Every Tuesday at 5:00 PM US Eastern (after early TT; adjust if needed)
    - cron: "0 17 * * 2"
      timezone: America/New_York
  workflow_dispatch:

jobs:
  ingest-titled-tuesday:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run titled_tuesday.py for today
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          python -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from titled_tuesday import convert

          tuesday = datetime.now(ZoneInfo('America/New_York')).date()
          print('Ingesting and scoring Titled Tuesday:', tuesday)
          convert(tuesday)
          "

      # Scoring runs inside convert() after games insert. This step is a safety net
      # using the same SB_KEY secret that ingestion already uses successfully.
      - name: Score lineups for this week (verify)
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          python -c "
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from supabase import create_client
          import os

          tuesday = datetime.now(ZoneInfo('America/New_York')).date()
          tuesday_str = tuesday.isoformat()
          sb = create_client(os.environ['SB_URL'], os.environ['SB_KEY'])
          print('Calling process_weekly_results for', tuesday_str)
          result = sb.rpc('process_weekly_results', {'week_date': tuesday_str}).execute()
          print('Scoring result:', result)
          "
