name: Titled Tuesday Ingestion

on:
  schedule:
    # Every Tuesday at 5:00 PM US Eastern (after early TT; adjust if needed)
    - cron: "0 17 * * 2"
      timezone: America/New_York
  workflow_dispatch:

jobs:
  ingest-titled-tuesday:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run titled_tuesday.py for today
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          python -c "from datetime import date; from titled_tuesday import convert; convert(date.today())"
