name: Titled Tuesday Ingestion

on:
  schedule:
    # Every Tuesday at 22:00 UTC (5 PM Eastern standard / 6 PM Eastern daylight)
    - cron: "0 22 * * 2"
  workflow_dispatch:

jobs:
  ingest-titled-tuesday:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run titled_tuesday.py for today
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          python -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from titled_tuesday import convert

          tuesday = datetime.now(ZoneInfo('America/New_York')).date()
          print('Ingesting and scoring Titled Tuesday:', tuesday)
          convert(tuesday)
          "

      # The Edge Function re-runs scoring as a safety net, then sends weekly emails.
      - name: Send weekly results emails
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SB_KEY}"
          if [ -z "$KEY" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY or SB_KEY secret configured; skipping weekly results emails."
            exit 0
          fi

          WEEK_JSON=$(python -c "
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          import json

          tuesday = datetime.now(ZoneInfo('America/New_York')).date()
          print(json.dumps({'week_date': tuesday.isoformat()}))
          ")
          echo "Request payload: $WEEK_JSON"
          curl -sf -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d "$WEEK_JSON" \
            "${SB_URL%/}/functions/v1/process-weekly-results"
