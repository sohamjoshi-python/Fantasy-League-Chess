name: Call Supabase Edge Function Weekly

on:
  schedule:
    # Wednesday 6 AM US Eastern — backup if Tuesday ingest/scoring was missed
    - cron: '0 6 * * 3'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      test_email:
        description: "Email recipient for manual test runs"
        required: true
        default: "sohampjoshi@gmail.com"
      send_all:
        description: "Send to all eligible users instead of only test_email"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  call-edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Score lineups via RPC (primary)
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          python -c "
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from supabase import create_client
          import os

          eastern = datetime.now(ZoneInfo('America/New_York')).date()
          days_since_tuesday = (eastern.weekday() - 1) % 7
          tuesday = eastern - timedelta(days=days_since_tuesday)
          tuesday_str = tuesday.isoformat()
          sb = create_client(os.environ['SB_URL'], os.environ['SB_KEY'])
          print('Backup scoring for Titled Tuesday', tuesday_str)
          result = sb.rpc('process_weekly_results', {'week_date': tuesday_str}).execute()
          print(result)
          "

      - name: Call process-weekly-results edge function (emails)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_KEY: ${{ secrets.SB_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TEST_EMAIL: ${{ github.event.inputs.test_email || 'sohampjoshi@gmail.com' }}
          SEND_ALL: ${{ github.event.inputs.send_all || 'false' }}
        run: |
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SB_KEY}"
          if [ -z "$KEY" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY or SB_KEY secret configured; skipping edge function."
            exit 0
          fi
          WEEK_JSON=$(python -c "
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import json
          import os
          eastern = datetime.now(ZoneInfo('America/New_York')).date()
          days_since_tuesday = (eastern.weekday() - 1) % 7
          tuesday = eastern - timedelta(days=days_since_tuesday)
          payload = {'week_date': tuesday.isoformat()}
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and os.environ.get('SEND_ALL') != 'true':
            payload['test_email'] = os.environ.get('TEST_EMAIL') or 'sohampjoshi@gmail.com'
          print(json.dumps(payload))
          ")
          echo "Request payload: $WEEK_JSON"
          curl -sf -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d "$WEEK_JSON" \
            https://wdbwzvnkfbyzazodfhsw.supabase.co/functions/v1/process-weekly-results
