name: Process League Payouts (Daily)

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 3am UTC
  workflow_dispatch:

jobs:
  process-payouts:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Run process_league_payouts SQL function
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          export PGHOST=$(echo $SB_URL | sed -E 's|https?://([^:/]+).*|\\1|')
          export PGUSER=postgres
          export PGPASSWORD=$SB_KEY
          export PGDATABASE=postgres
          export PGPORT=5432
          psql "host=$PGHOST user=$PGUSER password=$PGPASSWORD dbname=$PGDATABASE port=$PGPORT sslmode=require" -c "SELECT process_league_payouts();"
