name: Update ELO Cron

on:
  schedule:
    - cron: '0 2 * * *'  # every day at 2am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run update_elo.py
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          SB_KEY: ${{ secrets.SB_KEY }}
          CHESSCOM_CONTACT_EMAIL: ${{ secrets.CHESSCOM_CONTACT_EMAIL }}
        run: python update_elo.py
