name: Skip Expired Marketplace Turns

on:
  schedule:
    # Backup if nobody has the draft page open. Server cron should usually get there first.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      timeout_hours:
        description: "Hours a manager has to pick before the turn is skipped. Keep 12 unless you are intentionally testing one league from the SQL editor."
        required: false
        default: "12"

permissions: {}

jobs:
  process-marketplace-turns:
    runs-on: ubuntu-latest

    steps:
      - name: Skip expired turns
        env:
          TIMEOUT_HOURS: ${{ github.event.inputs.timeout_hours || '12' }}
        run: |
          # SUPABASE_SERVICE_ROLE_KEY / SB_KEY are the legacy JWT keys, kept
          # only until the legacy keys are disabled in the dashboard.
          SERVICE_KEY="${{ secrets.SB_SECRET_KEY }}"
          if [ -z "$SERVICE_KEY" ]; then
            SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          fi
          if [ -z "$SERVICE_KEY" ]; then
            SERVICE_KEY="${{ secrets.SB_KEY }}"
          fi
          BASE_URL="${{ secrets.SB_URL }}"

          echo "Skipping marketplace turns idle longer than ${TIMEOUT_HOURS} hours..."
          skip_response=$(curl -s -w "\n%{http_code}" -X POST \
            "${BASE_URL}/rest/v1/rpc/skip_expired_marketplace_turns" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "apikey: ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_timeout_hours\": ${TIMEOUT_HOURS}}")
          skip_code=$(echo "$skip_response" | tail -n1)
          skip_body=$(echo "$skip_response" | head -n -1)
          echo "Skip status: $skip_code"
          echo "Skip body: $skip_body"
          if [ "$skip_code" -ne 200 ]; then
            echo "Failed to skip expired marketplace turns"
            exit 1
          fi
